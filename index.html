<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#C9A688">
  <title>Poly</title>
  <style>
    :root {
      --camel:      #C9A688;   /* encabezado */
      --arena:      #F0E5DC;   /* franjas de títulos y pie */
      --crema:      #FCF7F3;   /* franjas de valores */
      --tostado:    #B98B6C;   /* texto de títulos */
      --cafe:       #2E2522;   /* valores */
      --gris-cafe:  #9C8478;   /* pie */
      --linea:      #E4D7CC;
      --serif: Georgia, "Times New Roman", serif;
      --sans:  Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--crema); color: var(--cafe); }
    body { min-height: 100vh; display: flex; flex-direction: column; }

    main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; background: var(--crema); }

    .titulo { background: var(--camel); color: #fff; font-family: var(--serif); font-weight: bold;
              font-size: clamp(30px, 9vw, 44px); line-height: 1.15; text-align: center;
              padding: 28px 16px 26px; margin: 0; }

    .etiqueta { background: var(--arena); color: var(--tostado); font-family: var(--sans); font-weight: bold;
                font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase;
                padding: 12px 24px; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }

    .valor { font-family: var(--serif); font-size: clamp(32px, 10vw, 44px); text-align: center;
             padding: 20px 16px 22px; }

    footer { background: var(--arena); border-top: 1px solid var(--linea); text-align: center;
             padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); font-family: var(--sans); font-size: 14px; }
    footer a { color: var(--gris-cafe); }
    footer a:focus-visible { outline: 2px solid var(--tostado); outline-offset: 3px; }

    .aviso { font-family: var(--sans); font-size: 17px; color: var(--gris-cafe); text-align: center; padding: 28px 16px; }
    .cargando .titulo { opacity: 0.85; }
  </style>
</head>
<body>
  <main id="c" class="cargando">
    <h1 class="titulo">Poly</h1>
    <div class="aviso">Cargando precio…</div>
  </main>
  <footer>
    <!-- Link del pie: reemplazá el href por el que tenías en el original si es otro -->
    <a href="https://www.instagram.com/poly.sf/" target="_blank" rel="noopener">@poly.sf &nbsp;·&nbsp; BV Pellegrini 2998</a>
  </footer>

  <script>
    // URL /exec de la Web App (la misma que URL_WEBAPP en Codigo.gs)
    var API = 'https://script.google.com/macros/s/AKfycbyi8GuWLJ5E1hLpExalbvq3zod7WOFFq_jfXDUVEW3A3hQ6urCdC_3UadfPytCzRc8h/exec';

    var cont = document.getElementById('c');
    var id = new URLSearchParams(location.search).get('id') || '';

    function agregar(tag, clase, texto) {
      var el = document.createElement(tag);
      el.className = clase;
      el.textContent = texto;
      cont.appendChild(el);
    }

    function mensaje(titulo, detalle) {
      cont.className = '';
      cont.innerHTML = '';
      agregar('h1', 'titulo', titulo);
      agregar('div', 'aviso', detalle);
    }

    if (!id) {
      mensaje('Poly', 'Escaneá el código de la etiqueta para ver el precio.');
    } else {
      // credentials: 'omit' → sin cookies de Google: no importa cuántas cuentas tenga el celular
      fetch(API + '?json=1&id=' + encodeURIComponent(id), { credentials: 'omit' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || d.error) { mensaje('Poly', 'No encontramos esta prenda. Consultá el precio en el local.'); return; }
          cont.className = '';
          cont.innerHTML = '';
          document.title = d.descripcion + ' · Poly';
          agregar('h1',  'titulo',   d.descripcion);
          agregar('div', 'etiqueta', d.titulo1);
          agregar('div', 'valor',    d.lista);
          agregar('div', 'etiqueta', d.titulo2);
          agregar('div', 'valor',    d.codigo);
        })
        .catch(function () { mensaje('Poly', 'No se pudo cargar el precio. Probá de nuevo en unos segundos.'); });
    }
  </script>
</body>
</html>
